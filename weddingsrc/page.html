<!doctype html>
<!-- Generated from weddingsrc/manifest.json; edit that file and run make wedding. -->
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{DOCUMENT_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="{{ROBOTS}}">
  <meta name="theme-color" content="{{THEME_COLOR}}">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'nonce-wedding-foliage'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{OG_LOCALE}}">
  <meta property="og:site_name" content="{{SITE_TITLE}}">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:image:secure_url" content="{{OG_IMAGE}}">
  <meta property="og:image:type" content="{{OG_IMAGE_TYPE}}">
  <meta property="og:image:width" content="{{OG_IMAGE_WIDTH}}">
  <meta property="og:image:height" content="{{OG_IMAGE_HEIGHT}}">
  <meta property="og:image:alt" content="{{OG_IMAGE_ALT}}">
  <meta name="twitter:card" content="summary_large_image">
  <script nonce="wedding-foliage">document.documentElement.classList.add("js");</script>
  <script src="./wedding.js?v=20260816h" type="module"></script>
  <link rel="stylesheet" href="./wedding.css?v=20260816j">
  <link rel="icon" href="./assets/flower-favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" sizes="180x180">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to wedding information</a>
  {{HERO}}
  {{NAV}}
  <main id="main-content" tabindex="-1">
    {{CONTENT}}
  </main>
  <footer class="site-footer"><p>{{FOOTER}}</p></footer>
  <div class="beehive-home" id="beehive-home">
    <img class="beehive-home__image" src="./assets/beehive.svg?v=20260816a" alt="A golden beehive">
  </div>
</body>
</html>
